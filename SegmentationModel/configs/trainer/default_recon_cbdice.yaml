lightning_trainer:
  _target_: lightning.pytorch.trainer.trainer.Trainer
  _partial_: True
  val_check_interval: 1.0
  max_time: "00:40:00:00"
  max_steps: 46000
  max_epochs: -1
  accelerator: gpu
  enable_checkpointing: True
  precision: 16-mixed
  log_every_n_steps: 10

lightning_module:
  _target_: module_recon.PLModuleRecon
  _partial_: True
  prediction_threshold: 0.5

  recon_only_holes: true
  recon_lambda: 0.1
  recon_loss: "l1"
  dropout_prob: 0.8
  holes: 32
  spatial_size: [1, 2, 2, 2 ]
  max_spatial_size: [1, 16, 16, 16]
  fill_value: -1.0

  loss:
    _target_: utils.combined_cbdice_loss.DiceCeCbdice
    beta: 0.67
    dicece_kwargs:
      sigmoid: True
      lambda_ce: 1.0
      lambda_dice: 0.33
    cbdice_kwargs:
      iter_: 5
      smooth: 1.0
      t_skeletonize_flage: False

  optimizer_factory:
    _target_: torch.optim.AdamW
    _partial_: True
    lr: ${lr}
    weight_decay: 0.1
    betas: [0.9, 0.999]

  scheduler_configs:
    linear_warmup:
      interval: step
      frequency: 10
      scheduler:
        _target_: torch.optim.lr_scheduler.LinearLR
        _partial_: True
        start_factor: 0.01
        end_factor: 1.0
        total_iters: 150
    cosine_annealing:
      interval: step
      frequency: 10
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        _partial_: True
        T_max: 5000
        eta_min: 0.0
        last_epoch: -1